<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#133b2b">
  <title>Offline · Everloop</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { display: grid; place-items: center; min-height: 90dvh; margin: 0; padding: 1.5rem; box-sizing: border-box; }
    main { width: min(100%, 25rem); }
    h1 { font-size: clamp(1.75rem, 6vw, 2.5rem); letter-spacing: -.035em; }
    p { line-height: 1.5; }
    a { background: #133b2b; color: #c5ed8b; display: inline-flex; align-items: center; min-height: 44px; padding: 0 .9rem; border-radius: .5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Everloop is offline</h1>
    <p>Reconnect to open your inbox and send or receive messages.</p>
    <a href="/inbox">Try again</a>
  </main>
</body>
</html>
